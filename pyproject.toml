[project]
name = "sigmoid-py"
version = "0.1.0"
description = "A super-statistical generative model for high-dimensional binary data, accelerated with PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GecklesTheClown", email = "nicholas.gecks@proton.me" }
]
keywords = ["statistics", "generative-model", "binary-data", "pytorch", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]
pandas = ["pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/GecklesTheClown/SiGMoiD"
Repository = "https://github.com/GecklesTheClown/SiGMoiD"
Issues = "https://github.com/GecklesTheClown/SiGMoiD/issues"
Paper = "https://doi.org/10.1371/journal.pcbi.1009275"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmoid"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
